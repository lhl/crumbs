[project]
name = "crumbs"
version = "0.1.0"
description = "Crumbs — local-only travel and food history reconstruction (Meta AI Hackathon 2026)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Heavy/local model deps are installed on the processing box, not required to
# import the package or run importer/grouping/export stages.
models = ["torch", "transformers", "Pillow"]

[project.scripts]
crumbs = "crumbs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crumbs*"]
